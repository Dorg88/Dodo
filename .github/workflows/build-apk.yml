name: Build HIKAYA APK

on:
  push:
    paths:
      - "storybook/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storybook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release

      - name: Name and verify the APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/hikaya.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/hikaya-debug.apk
          ls -la build/*.apk
          unzip -l build/hikaya.apk | grep -E "libapp.so|book.json|episode.json|AndroidManifest.xml"

      - uses: actions/upload-artifact@v4
        with:
          name: hikaya-apk
          path: |
            storybook/build/hikaya.apk
            storybook/build/hikaya-debug.apk
          if-no-files-found: error

      - name: Publish to the rolling "apk-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: حكايا — أحدث نسخة APK
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build from ${{ github.ref_name }} @ ${{ github.sha }}.
            Install hikaya.apk on Android (allow installs from unknown sources).
            hikaya-debug.apk is the debug build for testing.
          files: |
            storybook/build/hikaya.apk
            storybook/build/hikaya-debug.apk
