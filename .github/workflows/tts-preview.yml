name: TTS voice check and preview

# Runs only the voice verification and the short Episode 07 preview.
# It never runs the paid full batch.
on:
  push:
    paths:
      - "tts/requests/preview.request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TTS_WHISPER_MODEL_DIR: /tmp/whisper-small
    steps:
      - uses: actions/checkout@v4

      - name: Check that the API key secret exists
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-genai numpy scipy faster-whisper

      - name: Fetch Whisper small (for transcript checks)
        continue-on-error: true
        run: |
          mkdir -p /tmp/w && cd /tmp/w
          for i in 0 1 2 3; do npm pack -q @skillninja/shortmovie-telop-model-p$i >/dev/null; done
          for f in *.tgz; do mkdir -p x && tar xzf "$f" -C x && mv x/package "${f%.tgz}"; done
          mkdir -p "$TTS_WHISPER_MODEL_DIR"
          cp skillninja-*-p0-*/*.json "$TTS_WHISPER_MODEL_DIR"/
          cat skillninja-*-p0-*/model.bin.part0 skillninja-*-p1-*/model.bin.part1 \
              skillninja-*-p2-*/model.bin.part2 skillninja-*-p3-*/model.bin.part3 > "$TTS_WHISPER_MODEL_DIR/model.bin"

      - name: Verify voices
        id: verify
        continue-on-error: true
        run: python3 -m tts.pipeline verify-voices 2>&1 | tee /tmp/verify.log

      - name: Diagnose voices that failed
        continue-on-error: true
        run: |
          python3 -m tts.pipeline diagnose-voice --names Enzo 2>&1 | tee /tmp/diagnose.log
          python3 -m tts.pipeline list-voices > /tmp/list.log 2>&1

      - name: Generate preview
        id: preview
        continue-on-error: true
        run: python3 -m tts.pipeline preview 2>&1 | tee /tmp/preview.log; exit ${PIPESTATUS[0]}

      - name: Estimate
        continue-on-error: true
        run: python3 -m tts.pipeline estimate > /tmp/estimate.log 2>&1

      - name: Save results to the branch
        if: always()
        run: |
          R=tts/ci_results
          rm -rf $R && mkdir -p $R
          cp /tmp/verify.log /tmp/preview.log /tmp/estimate.log /tmp/diagnose.log /tmp/list.log $R/ 2>/dev/null || true
          cp tts/output/voice_verification.md tts/output/cost_estimate.md tts/output/voice_diagnosis.md tts/output/voice_catalog.md $R/ 2>/dev/null || true
          if [ -d tts/output/preview ]; then
            mkdir -p $R/preview
            cp tts/output/preview/*.mp3 tts/output/preview/*.json tts/output/preview/*.md $R/preview/
            cp -r tts/output/preview/lines $R/preview/ && rm -f $R/preview/lines/*.wav
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $R tts/config/voice_registry.json
          git commit -m "TTS voice check and preview results" || echo "nothing to commit"
          git push

      - name: Report
        if: always()
        run: |
          echo "verify: ${{ steps.verify.outcome }}  preview: ${{ steps.preview.outcome }}"
          cat tts/ci_results/voice_verification.md 2>/dev/null || true
