<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- HIKAYA launch intro. No backdrop behind the logos: they sit on the paper, light passes over their own shapes.
          Three logos in order: the Research & Studies
         Division, the Holy Shrine, then HIKAYA. Logos are the producer's
         original files, prepared by render_intro.py into logos/. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Amiri";
        src: url("assets/Amiri-Regular.ttf");
      }
      :root {
        --paper: #f6efe0;
        --walnut: #5b3a24;
        --gold: #b08d57;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper) url("assets/paper.png") repeat;
      }
      #root { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .logo-box { position: relative; display: flex; align-items: center; justify-content: center; }
      /* the light passes over the logo only: its own transparent shape is the mask, no box, no backdrop */
      .light {
        position: absolute; inset: 0; overflow: hidden;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;
      }
      #logo1 .light { -webkit-mask-image: url("logos/logo_section.png"); mask-image: url("logos/logo_section.png"); }
      #logo2 .light { -webkit-mask-image: url("logos/logo_shrine.png"); mask-image: url("logos/logo_shrine.png"); }
      #logo3 .light { -webkit-mask-image: url("logos/logo_hikaya.png"); mask-image: url("logos/logo_hikaya.png"); }
      .logo-box img { display: block; object-fit: contain; }
      #logo1 { width: 760px; height: 1000px; }
      #logo2 { width: 900px; height: 900px; }
      /* the Holy Shrine in gold: a warm glow that follows the logo's own shape (no disc, no ring) */
      #logo2 img { filter: drop-shadow(0 0 6px rgba(255, 214, 120, 0.9)) drop-shadow(0 0 26px rgba(222, 168, 58, 0.55)); }
      /* a warm night behind the gold, only while the Holy Shrine is on screen */
      #night { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(circle at 50% 47%, #4a3018 0%, #2a1b0e 48%, #150e07 100%); }
      #glow2 { position: absolute; inset: 0; opacity: 0;
        filter: blur(22px) brightness(1.35) saturate(1.2); }
      #logo3 { width: 900px; height: 900px; }
      .shine {
        position: absolute; top: -20%; left: 0;
        width: 180px; height: 140%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 252, 240, 0.8) 50%, rgba(255, 255, 255, 0) 100%);
        transform: rotate(18deg);
        opacity: 0;
      }
      #tagline {
        position: absolute; top: 1440px; width: 100%;
        text-align: center;
        font-family: "Amiri", serif; font-size: 64px; color: var(--walnut);
        opacity: 0;
      }
      #credit {
        position: absolute; top: 1730px; width: 100%;
        text-align: center;
        font-family: "Amiri", serif; font-size: 40px; color: #8e7d66;
        opacity: 0;
      }
      #rule {
        position: absolute; top: 1420px; left: 340px;
        width: 400px; height: 3px; background: var(--gold);
        transform-origin: 50% 50%;
      }
      #veil { position: absolute; inset: 0; background: var(--paper); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.6" data-width="1080" data-height="1920">

      <!-- 1. Research & Studies Division, Department of Religious Affairs -->
      <div id="s1" class="clip" data-start="0" data-duration="2.4" data-track-index="0">
        <div class="logo-box" id="logo1">
          <img src="logos/logo_section.png" alt="شعبة البحوث والدراسات" style="width: 100%; height: 100%" />
          <div class="light"><div class="shine" id="shine1"></div></div>
        </div>
      </div>

      <!-- 2. The Holy Shrine (main institution) -->
      <div id="s2" class="clip" data-start="2.4" data-duration="2.4" data-track-index="1">
        <div id="night"></div>
        <div class="logo-box" id="logo2">
          <img id="glow2" src="logos/logo_shrine.png" alt="" style="width: 100%; height: 100%" />
          <img src="logos/logo_shrine.png" alt="الأمانة العامة للعتبة الحسينية المقدسة" style="width: 100%; height: 100%; position: relative" />
          <div class="light"><div class="shine" id="shine2"></div></div>
        </div>
      </div>

      <!-- 3. HIKAYA -->
      <div id="s3" class="clip" data-start="4.8" data-duration="2.8" data-track-index="2">
        <div class="logo-box" id="logo3">
          <img src="logos/logo_hikaya.png" alt="حكايا" style="width: 100%; height: 100%" />
          <div class="light"><div class="shine" id="shine3"></div></div>
        </div>
        <div id="rule"></div>
        <div id="tagline">كتب مصوّرة ومسموعة</div>
        <div id="credit">فكرةً وتصميماً: ضرغام الگيار</div>
        <div id="veil"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1 — section logo: rise in, a sweep of light over it, lift away
      tl.fromTo("#logo1", { opacity: 0, scale: 0.9, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.85, ease: "power3.out" }, 0.15);
      tl.fromTo("#shine1", { x: -300, opacity: 0 }, { x: 900, opacity: 1, duration: 0.8, ease: "power1.inOut" }, 0.95);
      tl.to("#shine1", { opacity: 0, duration: 0.15 }, 1.6);
      tl.to("#logo1", { opacity: 0, scale: 1.04, y: -20, duration: 0.45, ease: "power2.in" }, 1.95);

      // 2 — Holy Shrine, in gold: gentle turn into place, the gold glows, a sweep of light over it
      tl.fromTo("#logo2", { opacity: 0, scale: 0.82, rotation: -4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.4)" }, 2.55);
      // the gold breathes: its glow swells once and settles
      tl.fromTo("#night", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, 2.4);
      tl.to("#night", { opacity: 0, duration: 0.45, ease: "sine.inOut" }, 4.35);
      tl.fromTo("#glow2", { opacity: 0 }, { opacity: 0.7, duration: 0.7, ease: "sine.out" }, 2.9);
      tl.to("#glow2", { opacity: 0.4, duration: 0.8, ease: "sine.inOut" }, 3.6);
      tl.fromTo("#shine2", { x: -300, opacity: 0 }, { x: 900, opacity: 1, duration: 0.8, ease: "power1.inOut" }, 3.3);
      tl.to("#shine2", { opacity: 0, duration: 0.15 }, 3.95);
      tl.to(["#logo2", "#glow2"], { opacity: 0, scale: 1.04, duration: 0.45, ease: "power2.in" }, 4.35);

      // 3 — HIKAYA: the book opens upward, light passes over it, the tagline settles
      tl.fromTo("#logo3", { opacity: 0, scaleY: 0.7, scaleX: 0.95, y: 40, transformOrigin: "50% 85%" },
        { opacity: 1, scaleY: 1, scaleX: 1, y: 0, duration: 0.9, ease: "power3.out" }, 4.9);
      tl.fromTo("#shine3", { x: -300, opacity: 0 }, { x: 1000, opacity: 1, duration: 0.9, ease: "power1.inOut" }, 5.7);
      tl.to("#shine3", { opacity: 0, duration: 0.15 }, 6.45);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 5.65);
      tl.fromTo("#tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 5.8);
      tl.fromTo("#credit", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.25);
      // fade to the app's own paper colour so the first screen follows seamlessly
      tl.fromTo("#veil", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 7.15);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
